<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Desk Service Recovery</title>
  <style>
    :root{
      --bg1:#10141c;
      --bg2:#030507;
      --panel:rgba(10,12,16,.86);
      --panel-border:rgba(255,255,255,.08);
      --text:#fff;
      --muted:rgba(255,255,255,.74);
      --btn:#1f2937;
      --btn-hover:#374151;
      --shadow:0 16px 40px rgba(0,0,0,.38);
      --radius:20px;
      --gold:#cfa52c;
    }

    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      font-family:Arial,Helvetica,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top,#1b2230 0%,var(--bg1) 42%,var(--bg2) 100%);
    }
    body{
      display:grid;
      place-items:center;
      padding:12px;
      overflow:hidden;
    }
    .app{
      width:100%;
      min-height:calc(100vh - 24px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
    }

    /* keep the controls exactly aligned to the card width */
    .stage,
    .controls-panel{
      width:min(94vw,62vh);
    }

    .stage{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .card-shell{
      width:100%;
      aspect-ratio:2 / 3;
      position:relative;
      perspective:1800px;
      filter:drop-shadow(0 18px 40px rgba(0,0,0,.42));
    }
    .card-flip{
      position:absolute;
      inset:0;
      transform-style:preserve-3d;
      transition:transform 950ms cubic-bezier(.2,.8,.2,1);
    }
    .card-shell.is-flipped .card-flip{
      transform:rotateY(180deg);
    }
    .card-face{
      position:absolute;
      inset:0;
      backface-visibility:hidden;
      border-radius:28px;
      overflow:hidden;
    }
    .card-content-face{ transform:rotateY(0deg); background:#f6f2ea; }
    .card-logo-face{ transform:rotateY(180deg); background:#08152b; }

    .template-img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      user-select:none;
      pointer-events:none;
    }

    /* CONTENT ZONES: strictly inside inner gold frame, below header and above footer */
    .content-overlay{
      position:absolute;
      inset:0;
      pointer-events:none;
    }

    .card-title{
      position:absolute;
      left:15%;
      right:15%;
      top:5.8%;
      height:9.5%;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--gold);
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.02em;
      font-size:clamp(.92rem,3.35vw,2.2rem);
      line-height:.96;
      text-wrap:balance;
      overflow-wrap:anywhere;
    }

    .card-id{
      position:absolute;
      left:8.3%;
      bottom:6.3%;
      color:var(--gold);
      font-size:clamp(.88rem,1.9vw,1.55rem);
      line-height:1;
      user-select:none;
    }

    /* Safe content body region */
    .text-layout{
      position:absolute;
      left:11.2%;
      right:11.2%;
      top:19.2%;
      bottom:15.0%;
      display:grid;
      grid-template-rows: 1fr 1fr;
      row-gap:2.8%;
      align-items:stretch;
      text-align:center;
      color:#2e2a28;
      overflow:hidden;
    }

    .text-block{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      min-height:0;
      overflow:hidden;
    }

    .section-label{
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.03em;
      line-height:1.05;
      font-size:clamp(.78rem,1.75vw,1.28rem);
      margin-bottom:1.5%;
      text-wrap:balance;
      flex:0 0 auto;
      text-shadow:0 1px 1px rgba(255,255,255,.18);
    }

    .section-text{
      width:100%;
      color:#302d2b;
      font-size:clamp(.92rem,1.98vw,1.58rem);
      line-height:1.23;
      text-wrap:balance;
      overflow-wrap:anywhere;
      display:-webkit-box;
      -webkit-box-orient:vertical;
      -webkit-line-clamp:10;
      overflow:hidden;
    }

    .answer-wrap.hidden{
      visibility:hidden;
      opacity:0;
    }

    /* Image card layout */
    .image-layout{
      position:absolute;
      left:11.2%;
      right:11.2%;
      top:19.2%;
      bottom:15.0%;
      display:none;
      flex-direction:column;
      align-items:center;
      text-align:center;
      overflow:hidden;
    }
    .image-box{
      width:100%;
      flex:1 1 auto;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      margin-bottom:3.5%;
    }
    .image-box img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
      border-radius:4px;
    }
    .image-prompt{
      flex:0 0 auto;
      color:var(--gold);
      text-transform:uppercase;
      line-height:1.12;
      font-size:clamp(.9rem,2vw,1.5rem);
      text-wrap:balance;
      padding:0 2%;
      margin-bottom:1%;
    }
    .image-answer{
      width:100%;
      margin-top:2.5%;
    }
    .image-answer.hidden{
      visibility:hidden;
      opacity:0;
      height:0;
      overflow:hidden;
      margin:0;
    }

    .controls-panel{
      background:var(--panel);
      border:1px solid var(--panel-border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .status{
      text-align:center;
      color:var(--muted);
      font-size:.94rem;
      min-height:1.2em;
    }
    .goto-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:10px;
    }
    .controls{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }
    button,select{
      width:100%;
      min-height:46px;
      border:0;
      border-radius:14px;
      font-size:.95rem;
      font-weight:700;
      box-shadow:0 8px 18px rgba(0,0,0,.2);
    }
    button{
      background:var(--btn);
      color:#fff;
      padding:11px 10px;
      cursor:pointer;
      touch-action:manipulation;
    }
    button:hover{ background:var(--btn-hover); }
    button:disabled{ opacity:.55; cursor:not-allowed; }
    select{
      background:#111827;
      color:#fff;
      padding:0 12px;
      border:1px solid rgba(255,255,255,.08);
    }
    .note{
      text-align:center;
      color:var(--muted);
      font-size:.86rem;
    }
    .loading{
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(0,0,0,.18);
      backdrop-filter:blur(2px);
      font-weight:700;
    }

    @media (orientation:landscape){
      .app{
        flex-direction:row;
        align-items:center;
        justify-content:center;
        gap:18px;
      }
      .stage{ width:min(42vw,58vh); }
      .controls-panel{ width:min(38vw,420px); }
      .controls{ grid-template-columns:1fr; }
    }

    @media (max-width:720px){
      body{ padding:8px; }
      .app{ gap:8px; }
      .stage,.controls-panel{ width:min(97vw,62vh); }
      .controls{ grid-template-columns:1fr; }
      .goto-row{ grid-template-columns:1fr; }
      .card-title{ font-size:clamp(.9rem,4.25vw,1.8rem); }
      .section-label{ font-size:clamp(.72rem,2.7vw,1rem); }
      .section-text{ font-size:clamp(.88rem,3.1vw,1.18rem); }
      .image-prompt{ font-size:clamp(.88rem,3vw,1.2rem); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <div class="card-shell" id="cardShell">
        <div class="card-flip">
          <!-- Visible content side: blank cream template -->
          <div class="card-face card-content-face">
            <img class="template-img" id="contentTemplate" alt="Content card template">
            <div class="content-overlay">
              <div class="card-title" id="cardTitle"></div>

              <div class="text-layout" id="textLayout">
                <div class="text-block">
                  <div class="section-label">Scenario</div>
                  <div class="section-text" id="scenarioText"></div>
                </div>

                <div class="text-block answer-wrap hidden" id="answerWrap">
                  <div class="section-label">Professional Approach</div>
                  <div class="section-text" id="answerText"></div>
                </div>
              </div>

              <div class="image-layout" id="imageLayout">
                <div class="image-box">
                  <img id="cardImage" alt="Card image">
                </div>
                <div class="image-prompt" id="imagePrompt"></div>
                <div class="image-answer hidden" id="imageAnswerWrap">
                  <div class="section-label">Professional Approach</div>
                  <div class="section-text" id="imageAnswerText"></div>
                </div>
              </div>

              <div class="card-id" id="cardId"></div>
            </div>
          </div>

          <!-- Flip side: decorative logo card -->
          <div class="card-face card-logo-face">
            <img class="template-img" id="logoTemplate" alt="Decorative card back">
          </div>
        </div>
        <div class="loading" id="loadingMask">Loading cards…</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="status" id="statusText">Loading cards…</div>

      <div class="goto-row">
        <select id="gotoSelect">
          <option value="">Go to card…</option>
        </select>
        <button id="gotoBtn">Go To</button>
      </div>

      <div class="controls">
        <button id="flipBtn">Flip Card</button>
        <button id="revealBtn">Reveal Answer</button>
        <button id="hideBtn">Hide Answer</button>
        <button id="resetDeckBtn">Reset Deck</button>
        <button id="fullscreenBtn">Full Screen</button>
      </div>

      <div class="note">Text is constrained inside the framed content zone only.</div>
    </div>
  </div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj2u2mNdNoaxrTnuNN3wcDEEZze0pZJEVlnrihL0UAA3cIyZop2xwRu5rsSgcsnIJ2PWDacDNaSjr9/pub?output=csv";

    /* Content side = cream blank card */
    const CONTENT_TEMPLATE_CANDIDATES = [
      "Card Back Horizontal Master.png",
      "back.png", "Back.png",
      "assets/cards/Card Back Horizontal Master.png",
      "assets/cards/back.png", "assets/cards/Back.png"
    ];

    /* Flip side = decorative logo card */
    const LOGO_TEMPLATE_CANDIDATES = [
      "Card Front Horizontal Master.png",
      "front.png", "Front.png",
      "assets/cards/Card Front Horizontal Master.png",
      "assets/cards/front.png", "assets/cards/Front.png"
    ];

    const IMAGE_EXTENSIONS = ["png","jpg","jpeg","webp"];

    const els = {
      contentTemplate: document.getElementById("contentTemplate"),
      logoTemplate: document.getElementById("logoTemplate"),
      cardShell: document.getElementById("cardShell"),
      cardTitle: document.getElementById("cardTitle"),
      cardId: document.getElementById("cardId"),
      textLayout: document.getElementById("textLayout"),
      scenarioText: document.getElementById("scenarioText"),
      answerWrap: document.getElementById("answerWrap"),
      answerText: document.getElementById("answerText"),
      imageLayout: document.getElementById("imageLayout"),
      cardImage: document.getElementById("cardImage"),
      imagePrompt: document.getElementById("imagePrompt"),
      imageAnswerWrap: document.getElementById("imageAnswerWrap"),
      imageAnswerText: document.getElementById("imageAnswerText"),
      statusText: document.getElementById("statusText"),
      flipBtn: document.getElementById("flipBtn"),
      revealBtn: document.getElementById("revealBtn"),
      hideBtn: document.getElementById("hideBtn"),
      resetDeckBtn: document.getElementById("resetDeckBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      gotoSelect: document.getElementById("gotoSelect"),
      gotoBtn: document.getElementById("gotoBtn"),
      loadingMask: document.getElementById("loadingMask")
    };

    const state = {
      deck: [],
      unusedIndices: [],
      currentCard: null,
      isAnimating: false
    };

    function parseCsvLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        const next = line[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function normalizeCard(row) {
      return {
        CardID: (row.CardID || "").trim(),
        CardType: ((row.CardType || "text").trim().toLowerCase()),
        Title: (row.Title || "").trim(),
        Scenario: (row.Scenario || "").trim(),
        ProfessionalApproach: (row.ProfessionalApproach || "").trim(),
        ImageURL: (row.ImageURL || "").trim(),
        ImagePrompt: (row.ImagePrompt || "").trim(),
        Active: ((row.Active || "Y").trim().toUpperCase()),
        Category: (row.Category || "").trim(),
        SortOrder: (row.SortOrder || "").trim()
      };
    }

    function isActiveCard(card) {
      return card.Active === "Y" && card.CardID && card.Title;
    }

    function refreshDeckPool() {
      state.unusedIndices = state.deck.map((_, i) => i);
    }

    function removeFromUnused(index) {
      state.unusedIndices = state.unusedIndices.filter(i => i !== index);
    }

    function pickRandomIndex() {
      if (!state.unusedIndices.length) refreshDeckPool();
      const poolIndex = Math.floor(Math.random() * state.unusedIndices.length);
      return state.unusedIndices.splice(poolIndex, 1)[0];
    }

    function setStatus(text) {
      els.statusText.textContent = text;
    }

    function hideAnswer() {
      els.answerWrap.classList.add("hidden");
      els.imageAnswerWrap.classList.add("hidden");
      els.revealBtn.disabled = !state.currentCard || !state.currentCard.ProfessionalApproach || state.isAnimating;
      els.hideBtn.disabled = true;
    }

    function showAnswer() {
      if (!state.currentCard || !state.currentCard.ProfessionalApproach || state.isAnimating) return;
      if (state.currentCard.CardType === "image") {
        els.imageAnswerWrap.classList.remove("hidden");
      } else {
        els.answerWrap.classList.remove("hidden");
      }
      els.revealBtn.disabled = true;
      els.hideBtn.disabled = false;
    }

    function normalizeAssetId(cardId) {
      return String(cardId || "").replace(/[^A-Za-z0-9]/g, "");
    }

    function imageCandidatesForCard(card) {
      const rawId = String(card.CardID || "").trim();
      const normalizedId = normalizeAssetId(card.CardID);
      const localCandidates = [];
      for (const ext of IMAGE_EXTENSIONS) {
        localCandidates.push(`${rawId}.${ext}`);
        localCandidates.push(`${normalizedId}.${ext}`);
        localCandidates.push(`assets/cards/${rawId}.${ext}`);
        localCandidates.push(`assets/cards/${normalizedId}.${ext}`);
      }
      return card.ImageURL ? [card.ImageURL, ...localCandidates] : localCandidates;
    }

    function testImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function resolveFirstWorkingImage(candidates) {
      for (const src of candidates) {
        const found = await testImage(src);
        if (found) return found;
      }
      return "";
    }

    async function resolveCardImage(card) {
      if (card.CardType !== "image") return "";
      return resolveFirstWorkingImage(imageCandidatesForCard(card));
    }

    async function renderCard(card) {
      state.currentCard = card;

      els.cardTitle.textContent = card.Title;
      els.cardId.textContent = card.CardID;

      // default state
      els.textLayout.style.display = "grid";
      els.imageLayout.style.display = "none";
      els.answerWrap.classList.add("hidden");
      els.imageAnswerWrap.classList.add("hidden");
      els.cardImage.removeAttribute("src");
      els.imagePrompt.textContent = "";
      els.answerText.textContent = card.ProfessionalApproach || "";
      els.imageAnswerText.textContent = card.ProfessionalApproach || "";

      if (card.CardType === "image") {
        els.textLayout.style.display = "none";
        els.imageLayout.style.display = "flex";
        const imgSrc = await resolveCardImage(card);
        if (imgSrc) els.cardImage.src = imgSrc;
        els.imagePrompt.textContent = card.ImagePrompt || "";
      } else {
        els.scenarioText.textContent = card.Scenario || "";
      }

      els.revealBtn.disabled = !card.ProfessionalApproach || state.isAnimating;
      els.hideBtn.disabled = true;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function showCardByIndex(index, sourceLabel = "Showing") {
      if (!state.deck.length || state.isAnimating || index < 0 || index >= state.deck.length) return;

      state.isAnimating = true;
      els.flipBtn.disabled = true;
      els.revealBtn.disabled = true;
      els.hideBtn.disabled = true;
      els.gotoBtn.disabled = true;

      const nextCard = state.deck[index];
      removeFromUnused(index);
      setStatus("Flipping card…");

      els.cardShell.classList.add("is-flipped");
      await wait(1000);
      await renderCard(nextCard);
      await wait(1600); // longer visible hold on the decorative side before the new content returns
      els.cardShell.classList.remove("is-flipped");
      await wait(1000);

      state.isAnimating = false;
      els.flipBtn.disabled = false;
      els.revealBtn.disabled = !nextCard.ProfessionalApproach;
      els.hideBtn.disabled = true;
      els.gotoBtn.disabled = !els.gotoSelect.value;

      const left = state.unusedIndices.length;
      setStatus(`${sourceLabel} ${nextCard.CardID}${left ? ` • ${left} card(s) left before reshuffle` : " • deck will reshuffle on next draw"}`);
    }

    async function flipToNextCard() {
      const index = pickRandomIndex();
      await showCardByIndex(index, "Showing");
    }

    async function resetDeck() {
      refreshDeckPool();
      state.currentCard = null;
      els.cardTitle.textContent = "";
      els.cardId.textContent = "";
      els.scenarioText.textContent = "";
      els.answerText.textContent = "";
      els.imageAnswerText.textContent = "";
      els.imagePrompt.textContent = "";
      els.cardImage.removeAttribute("src");
      els.textLayout.style.display = "grid";
      els.imageLayout.style.display = "none";
      els.answerWrap.classList.add("hidden");
      els.imageAnswerWrap.classList.add("hidden");
      els.cardShell.classList.remove("is-flipped");
      els.revealBtn.disabled = true;
      els.hideBtn.disabled = true;
      setStatus("Deck reset.");
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
      els.fullscreenBtn.textContent = document.fullscreenElement ? "Exit Full Screen" : "Full Screen";
    }

    async function loadSheetData() {
      const res = await fetch(SHEET_URL);
      const csv = await res.text();
      const cleaned = csv.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
      const lines = cleaned.split("\n").filter(Boolean);
      if (!lines.length) return [];

      const headers = parseCsvLine(lines[0]);
      const rows = lines.slice(1).map(line => {
        const values = parseCsvLine(line);
        const obj = {};
        headers.forEach((h, i) => obj[h] = values[i] || "");
        return normalizeCard(obj);
      });

      return rows.filter(isActiveCard);
    }

    function populateGotoMenu() {
      els.gotoSelect.innerHTML = '<option value="">Go to card…</option>';
      const sorted = [...state.deck].sort((a, b) => {
        const aKey = a.SortOrder ? Number(a.SortOrder) : Number.MAX_SAFE_INTEGER;
        const bKey = b.SortOrder ? Number(b.SortOrder) : Number.MAX_SAFE_INTEGER;
        if (aKey !== bKey) return aKey - bKey;
        return a.CardID.localeCompare(b.CardID);
      });

      sorted.forEach(card => {
        const option = document.createElement("option");
        option.value = card.CardID;
        option.textContent = `${card.CardID} — ${card.Title}`;
        els.gotoSelect.appendChild(option);
      });
    }

    async function goToSelectedCard() {
      const value = els.gotoSelect.value;
      if (!value) return;
      const index = state.deck.findIndex(card => card.CardID === value);
      if (index >= 0) {
        await showCardByIndex(index, "Showing");
      }
    }

    async function init() {
      const contentSrc = await resolveFirstWorkingImage(CONTENT_TEMPLATE_CANDIDATES);
      const logoSrc = await resolveFirstWorkingImage(LOGO_TEMPLATE_CANDIDATES);
      if (contentSrc) els.contentTemplate.src = contentSrc;
      if (logoSrc) els.logoTemplate.src = logoSrc;

      els.flipBtn.addEventListener("click", flipToNextCard);
      els.revealBtn.addEventListener("click", showAnswer);
      els.hideBtn.addEventListener("click", hideAnswer);
      els.resetDeckBtn.addEventListener("click", resetDeck);
      els.fullscreenBtn.addEventListener("click", toggleFullscreen);
      els.gotoBtn.addEventListener("click", goToSelectedCard);
      els.gotoSelect.addEventListener("change", () => {
        els.gotoBtn.disabled = !els.gotoSelect.value || state.isAnimating;
      });

      document.addEventListener("fullscreenchange", () => {
        els.fullscreenBtn.textContent = document.fullscreenElement ? "Exit Full Screen" : "Full Screen";
      });

      try {
        state.deck = await loadSheetData();
        refreshDeckPool();
        populateGotoMenu();

        if (!state.deck.length) {
          setStatus("No active cards found. Check your Google Sheet and Active column.");
          return;
        }

        els.revealBtn.disabled = true;
        els.hideBtn.disabled = true;
        els.gotoBtn.disabled = true;
        setStatus("Ready. Flip a card or choose one from Go To.");
      } catch (err) {
        console.error(err);
        setStatus("Could not load Google Sheet. Check your published CSV link.");
      } finally {
        els.loadingMask.style.display = "none";
      }
    }

    init();
  </script>
</body>
</html>
