<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Front Desk Service Recovery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <div class="stage">
      <div class="card-shell" id="cardShell">
        <div class="card-flip">
          <div class="card-face card-logo-face" id="logoFace" role="button" tabindex="0" aria-label="Draw a card"><img class="template-img" id="logoTemplate" alt="Decorative card front"></div>
          <div class="card-face card-content-face">
            <img class="template-img" id="contentTemplate" alt="Content card template">
            <div class="content-overlay">
              <div class="card-title" id="cardTitle"></div>
              <div class="text-layout" id="textLayout">
                <div class="text-block"><div class="section-label">Scenario</div><div class="section-text scenario-text" id="scenarioText"></div></div>
                <div class="text-block answer-wrap hidden" id="answerWrap"><div class="section-label">Professional Approach</div><div class="section-text answer-text" id="answerText"></div></div>
              </div>
              <div class="image-layout" id="imageLayout"><div class="image-box"><img id="cardImage" alt="Card image"></div><div class="image-prompt" id="imagePrompt"></div><div class="image-answer hidden" id="imageAnswerWrap"><div class="section-label">Professional Approach</div><div class="section-text" id="imageAnswerText"></div></div></div>
              <div class="card-id" id="cardId"></div>
            </div>
            <div class="tap-zone tap-zone-header" id="headerTapZone" role="button" tabindex="0" aria-label="Draw next card"></div>
            <div class="tap-zone tap-zone-center" id="centerTapZone" role="button" tabindex="0" aria-label="Show or hide professional approach"></div>
            <div class="tap-zone tap-zone-footer" id="footerTapZone" role="button" tabindex="0" aria-label="Draw next card"></div>
          </div>
        </div>
        <div class="loading" id="loadingMask">Loading cards…</div>
      </div>
    </div>
    <div class="controls-panel" id="controlsPanel">
      <div class="panel-top"><div class="status" id="statusText">Loading cards…</div><button class="panel-hide-btn" id="hideControlsBtn" type="button">Hide Controls</button></div>
      <div class="goto-row"><select id="gotoSelect" aria-label="Go to card"><option value="">Go to card…</option></select><button id="gotoBtn" type="button">Go To</button></div>
      <div class="controls"><button id="flipBtn" type="button">Flip Card</button><button id="revealBtn" type="button">Reveal Answer</button><button id="hideBtn" type="button">Hide Answer</button><button id="resetDeckBtn" type="button">Reset Deck</button><button id="fullscreenBtn" type="button">Full Screen</button></div>
    </div>
  </div>
  <button class="show-controls-btn" id="showControlsBtn" type="button" hidden>☰ Controls</button>
  <script src="app.js"></script>
</body>
</html>
