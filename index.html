<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Front Desk Service Recovery Cards</title>
  <style>
    :root {
      --bg1: #111317;
      --bg2: #030406;
      --panel: rgba(12, 14, 18, 0.78);
      --text: #ffffff;
      --muted: rgba(255,255,255,0.75);
      --btn: #1f2937;
      --btn-hover: #374151;
      --shadow: 0 18px 45px rgba(0,0,0,0.35);
      --radius: 22px;
      --gold: #d6af36;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1b2230 0%, var(--bg1) 40%, var(--bg2) 100%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 14px;
      overflow: hidden;
    }

    .app {
      width: 100%;
      min-height: calc(100vh - 28px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .stage {
      width: min(96vw, 72vh);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .card-shell {
      width: 100%;
      aspect-ratio: 2 / 3;
      position: relative;
      perspective: 1600px;
      filter: drop-shadow(0 18px 38px rgba(0,0,0,0.45));
    }

    .card-flip {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      transition: transform 700ms cubic-bezier(.2,.8,.2,1);
    }

    .card-shell.is-flipped .card-flip {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 28px;
      overflow: hidden;
    }

    .card-front { transform: rotateY(0deg); background: #f8f5ef; }
    .card-back { transform: rotateY(180deg); background: #09162e; }

    .template-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      padding: 6.5% 7.5%;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .title {
      flex: 0 0 auto;
      text-align: center;
      color: var(--gold);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      font-size: clamp(1rem, 4vw, 2.8rem);
      line-height: 0.94;
      text-wrap: balance;
      margin-top: 2%;
      margin-bottom: 3%;
      min-height: 12%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-inline: 6%;
    }

    .body {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 0;
      padding: 3% 4% 0 4%;
      color: #2e2a28;
      text-align: center;
    }

    .section-label {
      flex: 0 0 auto;
      color: #c79e27;
      text-transform: uppercase;
      font-size: clamp(0.85rem, 2.2vw, 1.8rem);
      letter-spacing: 0.03em;
      margin-bottom: 1.8%;
      text-wrap: balance;
    }

    .scenario-text,
    .answer-text,
    .image-prompt {
      text-wrap: balance;
      line-height: 1.25;
      font-size: clamp(0.95rem, 2.35vw, 2rem);
      color: #2d2a28;
    }

    .scenario-wrap {
      width: 100%;
      margin-top: 1%;
      margin-bottom: 4%;
    }

    .answer-wrap {
      width: 100%;
      margin-top: auto;
      margin-bottom: 12%;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .answer-wrap.hidden {
      opacity: 0;
      transform: translateY(10px);
      visibility: hidden;
      height: 0;
      margin: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .image-box {
      width: 96%;
      max-height: 62%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1.5%;
      margin-bottom: 3.5%;
      border-radius: 6px;
      overflow: hidden;
    }

    .image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 4px;
    }

    .image-prompt {
      color: #c79e27;
      text-transform: uppercase;
      line-height: 1.12;
      font-size: clamp(0.95rem, 2.55vw, 2.1rem);
      margin-bottom: 11%;
      padding-inline: 3%;
    }

    .footer-id {
      position: absolute;
      left: 8.2%;
      bottom: 6.2%;
      color: var(--gold);
      font-size: clamp(0.9rem, 2.35vw, 2rem);
      letter-spacing: 0.02em;
      line-height: 1;
      user-select: none;
    }

    .controls-panel {
      width: min(96vw, 72vh);
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .status {
      text-align: center;
      font-size: 0.98rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 14px;
      background: var(--btn);
      color: white;
      font-size: 0.98rem;
      font-weight: 700;
      padding: 12px 10px;
      cursor: pointer;
      touch-action: manipulation;
      min-height: 48px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    button:hover { background: var(--btn-hover); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(2px);
    }

    @media (orientation: landscape) {
      .app { gap: 10px; }
      .stage { width: min(52vw, 52vh); }
      .controls-panel { width: min(88vw, 950px); }
    }

    @media (max-width: 880px) {
      .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="stage">
      <div class="card-shell" id="cardShell">
        <div class="card-flip">
          <div class="card-face card-front">
            <img class="template-img" id="frontTemplate" alt="Front card template" />
            <div class="overlay">
              <div class="title" id="cardTitle"></div>
              <div class="body">
                <div class="scenario-wrap" id="scenarioWrap">
                  <div class="section-label">Scenario</div>
                  <div class="scenario-text" id="scenarioText"></div>
                </div>

                <div class="image-box" id="imageBox" style="display:none;">
                  <img id="cardImage" alt="Card illustration" />
                </div>

                <div class="image-prompt" id="imagePrompt" style="display:none;"></div>

                <div class="answer-wrap hidden" id="answerWrap">
                  <div class="section-label">Professional Approach</div>
                  <div class="answer-text" id="answerText"></div>
                </div>
              </div>
              <div class="footer-id" id="cardId"></div>
            </div>
          </div>

          <div class="card-face card-back">
            <img class="template-img" id="backTemplate" alt="Back card template" />
          </div>
        </div>
        <div class="loading" id="loadingMask">Loading cards…</div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="status" id="statusText">Waiting to load cards…</div>
      <div class="controls">
        <button id="flipBtn">Flip Card</button>
        <button id="revealBtn">Reveal Answer</button>
        <button id="hideBtn">Hide Answer</button>
        <button id="resetDeckBtn">Reset Deck</button>
        <button id="fullscreenBtn">Full Screen</button>
      </div>
      <div class="note">Portrait-first, but responsive for projector/landscape too.</div>
    </div>
  </div>

  <script>
    const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRj2u2mNdNoaxrTnuNN3wcDEEZze0pZJEVlnrihL0UAA3cIyZop2xwRu5rsSgcsnIJ2PWDacDNaSjr9/pub?output=csv";

    const FRONT_TEMPLATE_CANDIDATES = [
      "front.png", "front.jpg", "front.jpeg", "front.webp",
      "Front.png", "Front.jpg", "Front.jpeg", "Front.webp",
      "assets/cards/front.png", "assets/cards/front.jpg", "assets/cards/front.jpeg", "assets/cards/front.webp",
      "assets/cards/Front.png", "assets/cards/Front.jpg", "assets/cards/Front.jpeg", "assets/cards/Front.webp"
    ];
    const BACK_TEMPLATE_CANDIDATES = [
      "back.png", "back.jpg", "back.jpeg", "back.webp",
      "Back.png", "Back.jpg", "Back.jpeg", "Back.webp",
      "assets/cards/back.png", "assets/cards/back.jpg", "assets/cards/back.jpeg", "assets/cards/back.webp",
      "assets/cards/Back.png", "assets/cards/Back.jpg", "assets/cards/Back.jpeg", "assets/cards/Back.webp"
    ];
    const IMAGE_EXTENSIONS = ["png", "jpg", "jpeg", "webp"];

    const DEMO_CARDS = [
      {
        CardID: "LU-18", CardType: "text", Title: "POOL CLOSED",
        Scenario: "Yeah, it’s closed.",
        ProfessionalApproach: "I know that’s disappointing. The pool is temporarily closed for maintenance, but I’d be happy to share alternative options nearby.",
        ImageURL: "", ImagePrompt: "", Active: "Y", Category: "Service Recovery", SortOrder: "1"
      },
      {
        CardID: "LU-28", CardType: "image", Title: "LEVEL UP",
        Scenario: "",
        ProfessionalApproach: "A warm greeting, engaged posture, and calm confidence communicate professionalism and readiness to help.",
        ImageURL: "", ImagePrompt: "WHAT DOES THIS ENERGY COMMUNICATE?", Active: "Y", Category: "Front Desk", SortOrder: "2"
      },
      {
        CardID: "CI-17", CardType: "text", Title: "TWO GUESTS ARGUING AT THE DESK",
        Scenario: "Two guests checking in together are arguing loudly in the lobby while you are processing the reservation.",
        ProfessionalApproach: "Stay neutral and professional—don’t take sides. Keep your voice calm and focus on completing check-in efficiently. If behavior escalates or disturbs the lobby, involve MOD/security as appropriate.",
        ImageURL: "", ImagePrompt: "", Active: "Y", Category: "Conflict", SortOrder: "3"
      }
    ];

    const els = {
      frontTemplate: document.getElementById("frontTemplate"),
      backTemplate: document.getElementById("backTemplate"),
      cardShell: document.getElementById("cardShell"),
      cardTitle: document.getElementById("cardTitle"),
      scenarioWrap: document.getElementById("scenarioWrap"),
      scenarioText: document.getElementById("scenarioText"),
      imageBox: document.getElementById("imageBox"),
      cardImage: document.getElementById("cardImage"),
      imagePrompt: document.getElementById("imagePrompt"),
      answerWrap: document.getElementById("answerWrap"),
      answerText: document.getElementById("answerText"),
      cardId: document.getElementById("cardId"),
      statusText: document.getElementById("statusText"),
      flipBtn: document.getElementById("flipBtn"),
      revealBtn: document.getElementById("revealBtn"),
      hideBtn: document.getElementById("hideBtn"),
      resetDeckBtn: document.getElementById("resetDeckBtn"),
      fullscreenBtn: document.getElementById("fullscreenBtn"),
      loadingMask: document.getElementById("loadingMask")
    };

    const state = {
      deck: [],
      unusedIndices: [],
      currentCard: null,
      revealShown: false,
      isAnimating: false
    };

    function parseCsvLine(line) {
      const result = [];
      let current = "";
      let inQuotes = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        const next = line[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i += 1;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === "," && !inQuotes) {
          result.push(current.trim());
          current = "";
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function normalizeCard(row) {
      return {
        CardID: (row.CardID || "").trim(),
        CardType: ((row.CardType || "text").trim().toLowerCase()),
        Title: (row.Title || "").trim(),
        Scenario: (row.Scenario || "").trim(),
        ProfessionalApproach: (row.ProfessionalApproach || "").trim(),
        ImageURL: (row.ImageURL || "").trim(),
        ImagePrompt: (row.ImagePrompt || "").trim(),
        Active: ((row.Active || "Y").trim().toUpperCase()),
        Category: (row.Category || "").trim(),
        SortOrder: (row.SortOrder || "").trim()
      };
    }

    function isActiveCard(card) {
      return card.Active === "Y" && card.CardID && card.Title;
    }

    function refreshDeckPool() {
      state.unusedIndices = state.deck.map((_, i) => i);
    }

    function pickRandomIndex() {
      if (!state.unusedIndices.length) refreshDeckPool();
      const poolIndex = Math.floor(Math.random() * state.unusedIndices.length);
      return state.unusedIndices.splice(poolIndex, 1)[0];
    }

    function setStatus(text) {
      els.statusText.textContent = text;
    }

    function hideAnswer() {
      state.revealShown = false;
      els.answerWrap.classList.add("hidden");
      els.revealBtn.disabled = !state.currentCard || !state.currentCard.ProfessionalApproach || state.isAnimating;
      els.hideBtn.disabled = true;
    }

    function showAnswer() {
      if (!state.currentCard || !state.currentCard.ProfessionalApproach) return;
      state.revealShown = true;
      els.answerWrap.classList.remove("hidden");
      els.revealBtn.disabled = true;
      els.hideBtn.disabled = state.isAnimating ? true : false;
    }

    function normalizeAssetId(cardId) {
      return String(cardId || "").replace(/[^A-Za-z0-9]/g, "");
    }

    function imageCandidatesForCard(card) {
      const rawId = String(card.CardID || "").trim();
      const normalizedId = normalizeAssetId(card.CardID);
      const localCandidates = [];

      for (const ext of IMAGE_EXTENSIONS) {
        localCandidates.push(`${rawId}.${ext}`);
        localCandidates.push(`${normalizedId}.${ext}`);
        localCandidates.push(`assets/cards/${rawId}.${ext}`);
        localCandidates.push(`assets/cards/${normalizedId}.${ext}`);
      }

      if (card.ImageURL) return [card.ImageURL, ...localCandidates];
      return localCandidates;
    }

    function testImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(src);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function resolveCardImage(card) {
      if (card.CardType !== "image") return "";
      const candidates = imageCandidatesForCard(card);
      for (const src of candidates) {
        const found = await testImage(src);
        if (found) return found;
      }
      return "";
    }

    async function renderCard(card) {
      state.currentCard = card;
      els.cardTitle.textContent = card.Title;
      els.cardId.textContent = card.CardID;
      els.scenarioText.textContent = card.Scenario;
      els.answerText.textContent = card.ProfessionalApproach || "";

      const hasAnswer = !!card.ProfessionalApproach;
      const isImage = card.CardType === "image";

      els.scenarioWrap.style.display = isImage ? "none" : "";
      els.imageBox.style.display = "none";
      els.imagePrompt.style.display = "none";
      els.cardImage.removeAttribute("src");

      if (isImage) {
        const imgSrc = await resolveCardImage(card);
        if (imgSrc) {
          els.cardImage.src = imgSrc;
          els.imageBox.style.display = "";
        }
        if (card.ImagePrompt) {
          els.imagePrompt.textContent = card.ImagePrompt;
          els.imagePrompt.style.display = "";
        }
      }

      state.revealShown = false;
      els.answerWrap.classList.add("hidden");
      els.revealBtn.disabled = !hasAnswer || state.isAnimating;
      els.hideBtn.disabled = true;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function flipToNextCard() {
      if (!state.deck.length || state.isAnimating) return;

      state.isAnimating = true;
      els.flipBtn.disabled = true;
      els.revealBtn.disabled = true;
      els.hideBtn.disabled = true;

      const nextCard = state.deck[pickRandomIndex()];
      setStatus("Drawing random card…");
      els.cardShell.classList.add("is-flipped");

      await wait(420);
      await renderCard(nextCard);
      await wait(180);
      els.cardShell.classList.remove("is-flipped");
      await wait(720);

      state.isAnimating = false;
      els.flipBtn.disabled = false;
      els.revealBtn.disabled = !nextCard.ProfessionalApproach;
      els.hideBtn.disabled = true;

      const left = state.unusedIndices.length;
      setStatus(`Showing ${nextCard.CardID}${left ? ` • ${left} card(s) left before reshuffle` : " • deck will reshuffle on next draw"}`);
    }

    async function resetDeck() {
      refreshDeckPool();
      hideAnswer();
      setStatus("Deck reset.");
      if (state.currentCard) {
        els.revealBtn.disabled = !state.currentCard.ProfessionalApproach || state.isAnimating;
      }
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (_) {}
      els.fullscreenBtn.textContent = document.fullscreenElement ? "Exit Full Screen" : "Full Screen";
    }

    async function loadSheetData() {
      if (!SHEET_URL || SHEET_URL.includes("PUT_YOUR_PUBLISHED_CSV_URL_HERE")) {
        return DEMO_CARDS.map(normalizeCard).filter(isActiveCard);
      }

      const res = await fetch(SHEET_URL);
      const csv = await res.text();
      const cleaned = csv.replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();

      const lines = cleaned.split("\n").filter(Boolean);
      if (!lines.length) return [];

      const headers = parseCsvLine(lines[0]);
      const rows = lines.slice(1).map(line => {
        const values = parseCsvLine(line);
        const obj = {};
        headers.forEach((h, i) => obj[h] = values[i] || "");
        return normalizeCard(obj);
      });

      return rows.filter(isActiveCard);
    }

    async function resolveFirstWorkingImage(candidates) {
      for (const src of candidates) {
        const found = await testImage(src);
        if (found) return found;
      }
      return "";
    }

    async function init() {
      const frontSrc = await resolveFirstWorkingImage(FRONT_TEMPLATE_CANDIDATES);
      const backSrc = await resolveFirstWorkingImage(BACK_TEMPLATE_CANDIDATES);
      if (frontSrc) els.frontTemplate.src = frontSrc;
      if (backSrc) els.backTemplate.src = backSrc;

      els.flipBtn.addEventListener("click", flipToNextCard);
      els.revealBtn.addEventListener("click", showAnswer);
      els.hideBtn.addEventListener("click", hideAnswer);
      els.resetDeckBtn.addEventListener("click", resetDeck);
      els.fullscreenBtn.addEventListener("click", toggleFullscreen);
      document.addEventListener("fullscreenchange", () => {
        els.fullscreenBtn.textContent = document.fullscreenElement ? "Exit Full Screen" : "Full Screen";
      });

      setStatus("Loading cards…");

      try {
        state.deck = await loadSheetData();
        refreshDeckPool();

        if (!state.deck.length) {
          setStatus("No active cards found. Check your Google Sheet and Active column.");
          return;
        }

        await flipToNextCard();
      } catch (err) {
        console.error(err);
        setStatus("Could not load Google Sheet. Use the demo cards or check your CSV URL.");
      } finally {
        els.loadingMask.style.display = "none";
      }
    }

    init();
  </script>
</body>
</html>
